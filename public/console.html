<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>协作平台 · 控制台</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#1b1f27; --ink-2:#4a5162; --ink-3:#858c9c;
    --line:#e6e8ee; --line-2:#eef0f5;
    --brand:#3557d6; --brand-soft:#eef2ff;
    --hit:#c0522a; --hit-bg:#fdf1ec;
    --miss:#98a0b0; --miss-bg:#f2f4f7;
    --err:#9a6c00; --err-bg:#fdf6e3;
    --ok:#1f7a4d; --ok-bg:#ecf7f1;
    --stop:#b3261e; --stop-bg:#fdeceb;
    --void:#c3c9d6;
    --shadow:0 1px 2px rgba(20,26,40,.05), 0 6px 20px rgba(20,26,40,.05);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  a{color:var(--brand)}
  code{font-family:var(--mono);font-size:12px;background:#f2f4f8;padding:1px 5px;border-radius:4px}

  /* ── 顶栏 ──────────────────────────────────────────────────
     状态徽标在这里，而不是占一整块。它回答「平台还在不在」——
     那件事必须一眼能看见，但不该是打开页面读到的第一段话。 */
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:11px 24px;
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  header .spacer{flex:1}
  header nav a{font-size:13px;color:var(--ink-2);text-decoration:none;margin-left:16px;
    padding:3px 0;border-bottom:2px solid transparent}
  header nav a:hover{color:var(--brand);border-bottom-color:var(--brand)}

  .live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);
    background:var(--miss-bg);border:1px solid var(--line);border-radius:20px;padding:3px 11px 3px 8px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--void);flex:none}
  .live.alive{background:var(--ok-bg);border-color:#cfe8db;color:#17603c}
  .live.alive i{background:var(--ok);box-shadow:0 0 0 3px rgba(31,122,77,.14)}
  .live.late{background:var(--err-bg);border-color:#f0e2bf;color:#7a5600}
  .live.late i{background:var(--err)}
  .live.stopped{background:var(--stop-bg);border-color:#f2cfcc;color:#8d1f19}
  .live.stopped i{background:var(--stop)}

  main{max-width:1120px;margin:0 auto;padding:22px 24px 130px}

  /* ── 提示 ──────────────────────────────────────────────────
     只留真正会把人带偏的那几处。解释性的长文一律不进页面 ——
     一个要读三百字才敢用的界面，管理员打开两次就不会再打开了。 */
  .help-tip{display:inline-flex;align-items:center;justify-content:center;
    width:15px;height:15px;border-radius:50%;border:1px solid #c3c9d6;background:#fff;
    color:var(--ink-3);font-size:10.5px;font-weight:700;cursor:help;flex:none;
    font-family:var(--mono);line-height:1;padding:0;vertical-align:middle}
  .help-tip:hover,.help-tip:focus-visible{border-color:var(--brand);color:var(--brand);outline:none}
  #tipLayer{position:fixed;z-index:100;display:none;max-width:380px;
    background:#1b1f27;color:#eef1f7;border-radius:9px;padding:11px 13px;
    font-size:12.5px;line-height:1.65;box-shadow:0 10px 30px rgba(16,20,30,.28)}
  #tipLayer b{color:#fff}

  /* ── 第一屏：项目 ──────────────────────────────────────────
     每个项目一块、横着排满。**这是「我的东西」的空间**：扫一眼就知道
     有几个仓库在动、哪个要你管。名字大、状态字大、其余都小。
     ⚠️ 「要你管」用边框和色块的**重量**表达，不靠一个数字 ——
     数字要读，「这块红了」不用读。
     ⚠️ 有上限宽度：只有一个项目时让它撑满整行，右边会空出一大片，
     读者的眼睛会先去找那块空白里「丢了什么」。 */
  .projects{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .proj{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;box-shadow:var(--shadow);flex:1 1 260px;max-width:400px;min-width:0;
    border-top:3px solid var(--void);transition:transform .1s}
  .proj.attn{border-top-color:var(--hit)}
  .proj.broken{border-top-color:var(--err)}
  .proj.alive{border-top-color:var(--ok)}
  .proj .pname{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;letter-spacing:.1px}
  .proj .pstat{font-size:19px;font-weight:640;line-height:1.45;margin-top:3px;font-variant-numeric:tabular-nums}
  .proj.attn .pstat{color:var(--hit)}
  .proj.broken .pstat{color:var(--err)}
  .proj.alive .pstat{color:var(--ok)}
  .proj .pstat small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:5px}
  /* 变更条：一小块一次变更，颜色就是它的定论。它不归一化 ——
     看到的是「一共这几件、各是什么」，不是一个比例。 */
  .strip{display:flex;gap:4px;margin-top:11px;min-height:11px;flex-wrap:wrap}
  .strip i{display:block;width:11px;height:11px;border-radius:3px;background:var(--miss);opacity:.4}
  .strip i.h{background:var(--hit);opacity:1}
  .strip i.e{background:var(--err);opacity:1}
  .strip i.u{background:none;border:1px dashed var(--void);opacity:1}
  .proj .pmeta{font-size:11.5px;color:var(--ink-3);margin-top:8px}

  /* ── 第二屏：要你管的 ──────────────────────────────────────
     这一块是全页唯一的「待办」。它不是数据总览 —— 进来一张就表示
     确实有一件事需要人在场。 */
  section{margin-top:26px}
  section > h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:7px;font-weight:650}
  section > h2 .n{font-weight:400;color:var(--ink-3);font-size:12.5px}

  /* 组头。两类「要你管」的处置完全不同，所以分组而不是混排 ——
     混在一张列表里按紧急度排，一个昨天超时的旧记录会压住刚刚发生的事。 */
  .grouphead{display:flex;align-items:baseline;gap:8px;margin:18px 0 9px;font-size:13px}
  .grouphead:first-child{margin-top:0}
  .grouphead b{font-weight:650}
  .grouphead .n{color:var(--ink-3);font-size:12px}
  .grouphead .gh-note{color:var(--ink-3);font-size:12px;font-weight:400}
  .grouphead.e b{color:var(--err)}
  .grouphead.h b{color:var(--hit)}

  .need{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:13px 15px;box-shadow:var(--shadow);margin-bottom:10px;
    border-left:3px solid var(--hit)}
  /* 「判断没做成」用**斜纹**，不用又一种颜色。
     它既不是「有问题」（实心红）也不是「没事」（淡灰），它是**缺了一块** ——
     斜纹读起来正是这个意思，而再给一个颜色只会让它看起来像第三类问题。 */
  .need.broken{border-left-color:var(--err);
    background-image:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(154,108,0,.05) 6px,rgba(154,108,0,.05) 12px)}
  /* 一张卡＝一件**发生过的事**，不是一条记录。
     所以第一行读起来要像一句话：「某位同事 · 36 分钟前 · 「配置管理」 看着可疑」。
     ⚠️ 标题原本写在最左边、「命中」紧跟其后 —— 那是元数据的排法：
     人得先认出这是谁、什么时候，才谈得上判它对不对。 */
  .need .nhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .need .nwho{font-weight:650;font-size:13.5px;flex:none}
  .need .nwhen{font-size:12px;color:var(--ink-3);flex:none}
  .need .ntitle{font-size:13.5px;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
  .need .ntag{font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 8px;flex:none;white-space:nowrap}
  .need .ntag.h{background:var(--hit-bg);color:var(--hit)}
  .need .ntag.e{background:var(--err-bg);color:var(--err)}
  .need .nmeta{font-size:11.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
  .need .says{margin-top:8px;font-size:13px;color:var(--ink-2);line-height:1.62}
  .need .says b{color:var(--ink)}
  .need .acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;align-items:center}
  .need .acts .hint{font-size:11.5px;color:var(--ink-3);margin-left:2px}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);padding:4px 13px;font-size:12.5px;transition:.12s}
  button:hover{border-color:var(--brbtn,#c8cedb);background:#fafbfd}
  button.yes{color:#17603c;border-color:#cfe8db;background:var(--ok-bg)}
  button.yes:hover{background:#e2f3ea}
  button.no{color:#8d1f19;border-color:#f2cfcc;background:var(--stop-bg)}
  button.no:hover{background:#fbe0dd}
  button.ghost{color:var(--ink-3)}
  button:disabled{opacity:.5;cursor:default}

  /* 每次判定 —— 展开可见，收起时不占地方 */
  .jrow{display:flex;gap:8px;align-items:baseline;font-size:12.5px;
    padding:7px 0;border-top:1px dashed var(--line-2);margin-top:4px;flex-wrap:wrap}
  /* 结局的色块。全页只有这一种「一个方块 = 一次结局」的记号，项目条、
     判定行、统计点图都用它 —— 同一种颜色在三个地方必须读成同一件事。 */
  .dot{display:block;width:7px;height:7px;border-radius:2px;flex:none;
    background:var(--miss);opacity:.45;margin-top:4px}
  .dot.h{background:var(--hit);opacity:1}
  .dot.e{background:var(--err);opacity:1}
  /* 描边 = 人已经表过态。与点图是同一个语汇 —— 同一种记号在页面各处
     必须读成同一件事，否则读者得为每一处重新学一遍图例。 */
  .dot.r{outline:1.5px solid var(--ink-2);outline-offset:1px}
  .jrow .pol{color:var(--ink-3);font-family:var(--mono);font-size:11.5px;flex:none}
  .jrow .why{color:var(--ink-2);flex:1;min-width:0;overflow-wrap:anywhere}
  .jrow .pre{color:var(--ink-3);font-size:11.5px;flex-basis:100%;padding-left:15px}

  /* 小样本点图：一格一条，按结局上色，被人表过态的加描边。
     ⚠️ 它不归一化 —— 读者看到的是「一共只有这几件」，不是一个百分比。 */
  .dots{display:flex;gap:2px;flex-wrap:wrap;align-items:center;margin-left:8px}
  .dots i{display:block;width:8px;height:8px;border-radius:2px;background:var(--miss);opacity:.4}
  .dots i.h{background:var(--hit);opacity:1}
  .dots i.e{background:var(--err);opacity:1}
  .dots i.r{outline:1.5px solid var(--ink-2);outline-offset:1px}

  /* ── 其余的变更（折叠）────────────────────────────────────
     它们照样要在，否则「看过没问题」和「没看过」就分不开了；
     但它们不该抢在需要动手的前面。 */
  .rest-toggle{background:none;border:1px dashed var(--line);width:100%;text-align:left;
    padding:9px 13px;color:var(--ink-2);font-size:13px;border-radius:10px}
  .rest-toggle:hover{border-color:#c8cedb;background:#fafbfd;color:var(--ink)}
  .row{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--panel);
    border:1px solid var(--line);border-radius:9px;margin-bottom:6px;font-size:13px;cursor:pointer}
  .row:hover{border-color:#d6dbe6}
  .row .dot{margin-top:0}
  .row .rname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .rproj{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);flex:none}
  .row .rtime{font-size:11.5px;color:var(--ink-3);flex:none}

  /* ── 空状态 ────────────────────────────────────────────────
     ⚠️ 空列表有四种空法，处置完全不同（见 server 的 emptyReason）。
     它们绝不能长得一样 —— 把「没人盯着」读成「没事发生」，
     正是这个平台存在的理由。 */
  .banner{border-radius:11px;padding:15px 17px;margin-bottom:18px;font-size:13.5px;
    line-height:1.7;border:1px solid var(--line)}
  .banner b{font-weight:650}
  .banner.warn{background:var(--err-bg);border-color:#f0e2bf;color:#6b4d00}
  .banner.stop{background:var(--stop-bg);border-color:#f2cfcc;color:#8d1f19}
  .banner.info{background:var(--brand-soft);border-color:#dbe3ff;color:#27408f}
  .banner.quiet{background:var(--panel);color:var(--ink-2)}
  .banner code{background:rgba(0,0,0,.06)}

  /* ── 问她（固定在底部）────────────────────────────────────────
     ⚠️ **它不在第一屏最上面，这是刻意的。**
     问题是从「看见」里长出来的，不是从「会问」里长出来的：人先看到
     「这条审核没通过」「这次没看成」，才知道要问什么。把输入框摆在顶上，
     等于要求他先想好一个正确的问题 —— 而这恰恰是他做不到的事。
     所以它固定在底部：看完了，手边就有地方追问。 */
  #butler{position:fixed;left:0;right:0;bottom:0;z-index:40;
    padding:26px 24px 12px;pointer-events:none;
    background:linear-gradient(to bottom,rgba(246,247,249,0),var(--bg) 26%)}
  #butler .askwrap{max-width:1120px;margin:0 auto;pointer-events:auto}
  #askOut{margin-bottom:8px;max-height:50vh;overflow:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow)}
  #askOut.bad{border-left:3px solid var(--err)}
  #askOut .ans{white-space:pre-wrap;font-size:13.5px;line-height:1.78;color:var(--ink)}
  #askOut .err{font-size:13px;line-height:1.7;color:#8d1f19}
  #askOut details{margin-top:11px;font-size:11.5px;color:var(--ink-3)}
  #askOut summary{cursor:pointer;outline:none}
  #askOut pre{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);
    font-size:11px;line-height:1.6;max-height:300px;overflow:auto;
    background:#f7f8fb;border-radius:8px;padding:10px;margin:8px 0 0}
  .askbar{display:flex;gap:8px;align-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:11px;padding:7px 9px;box-shadow:var(--shadow)}
  .askbar input{flex:1;min-width:0;border:none;outline:none;font:inherit;
    background:none;color:var(--ink);padding:5px 6px}
  .askbar input::placeholder{color:var(--ink-3)}
  .askbar button{flex:none}

  /* ── 导览 ────────────────────────────────────────────────────
     她替人先看一遍：今天整体怎么样、先看哪几件。
     ⚠️ 那几件**可点**，点了会滚到对应卡片并闪一下 —— 「带路」这件事，
     如果只是列个清单不把人送过去，读者仍要自己找。 */
  .tourbar{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--brand);
    border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .tourbar .tintro{font-size:13.5px;line-height:1.78;color:var(--ink);white-space:pre-wrap}
  .tourbar .tstops{list-style:none;margin:11px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
  .tourbar .tstops li{display:flex;gap:9px;align-items:baseline;font-size:13px;
    padding:6px 10px;border-radius:8px;cursor:pointer;background:#fafbfd;
    border:1px solid transparent;transition:background .12s}
  .tourbar .tstops li:hover{background:var(--brand-soft);border-color:#dbe3ff}
  .tourbar .tstops .no{font-family:var(--mono);font-size:11.5px;color:var(--brand);
    font-weight:700;flex:none;min-width:12px}
  .tourbar .tstops .tt{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-weight:600}
  .tourbar .tstops .tw{color:var(--ink-3);font-size:12px;flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tourbar .tclosing{margin-top:10px;font-size:12.5px;color:var(--ink-2);white-space:pre-wrap}

  /* 她讲这一件的话 —— 长在卡片里，不是聊天记录 */
  .her{margin-top:10px;padding:11px 13px;background:#f8f9fc;border-radius:9px;
    border-left:3px solid var(--brand);font-size:13px;line-height:1.75}
  .her .why{color:var(--ink-3);font-size:12px;margin-bottom:6px}
  .her .why b{color:var(--brand);font-weight:650;margin-right:6px}
  .her .say{color:var(--ink);white-space:pre-wrap}
  .need.flash,.row.flash{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft),var(--shadow)}

  /* ── 观察 / 记录 ─────────────────────────────────────────── */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tabs button{border:none;background:none;border-radius:0;border-bottom:2px solid transparent;
    padding:7px 13px;color:var(--ink-3);font-size:13px}
  .tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  .tabs .cnt{color:var(--ink-3);font-weight:400;margin-left:5px;font-size:12px}
  .pane{display:none}
  .pane.on{display:block}
  .stat-row{display:flex;align-items:center;gap:14px;padding:11px 14px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;margin-bottom:8px;flex-wrap:wrap}
  .stat-row .sp{font-family:var(--mono);font-size:12px;font-weight:600;min-width:190px}
  .stat-row .sv{font-size:11.5px;color:var(--ink-3)}
  .stat-row .sv b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
  .stat-row .sv b.bad{color:var(--err)}
  .stat-row .health{font-size:11.5px;color:var(--ink-3);margin-left:auto}
  .foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--ink-3);line-height:1.9}
  .empty{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:13px}
</style>
</head>
<body>

<header>
  <h1>协作平台</h1>
  <span class="live" id="live"><i></i><span id="liveText">正在读取…</span></span>
  <span class="spacer"></span>
  <nav>
    <a href="/diagram">链路图</a>
  </nav>
</header>

<div id="tipLayer"></div>

<main>
  <div id="banner"></div>

  <!-- ═══════════ 导览：她替你先看一遍 ═══════════ -->
  <section id="tourSec" hidden>
    <div class="tourbar" id="tourBar"></div>
  </section>

  <!-- ═══════════ 第一屏：项目 ═══════════ -->
  <div class="projects" id="projects"></div>

  <!-- ═══════════ 第二屏：要你管的 ═══════════ -->
  <section id="attentionSec">
    <h2>要你管的 <span class="n" id="attnN"></span>
      <i class="help-tip" data-tip="attention" tabindex="0">?</i>
    </h2>
    <div id="attnList"></div>
  </section>

  <!-- ═══════════ 其余的变更 ═══════════ -->
  <section id="restSec">
    <button class="rest-toggle" id="restToggle"></button>
    <div id="restList" hidden></div>
  </section>

  <!-- ═══════════ 观察 / 记录 ═══════════ -->
  <section id="panes">
    <div class="tabs">
      <button data-pane="watch" class="on">策略观察 <span class="cnt" id="tabWatchN"></span></button>
      <button data-pane="log">判断记录 <span class="cnt" id="tabLogN"></span></button>
    </div>
    <div class="pane on" id="pane-watch">
      <p class="empty" id="watchEmpty" hidden></p>
      <div id="statsList"></div>
    </div>
    <div class="pane" id="pane-log">
      <div id="logList"></div>
    </div>
  </section>

  <div class="foot">
    <div>身份<b>自报</b>，未经验证 —— 这是流程约束，不是权限</div>
    <div>页面上的每个数字，要么来自判断记录、要么来自代码托管平台的客观事实，没有第三个来源</div>
  </div>
</main>

<!-- ═══════════ 问她：固定在底部，看完再说 ═══════════ -->
<div id="butler">
  <div class="askwrap">
    <div id="askOut" hidden></div>
    <div class="askbar">
      <input id="askInput" type="text" autocomplete="off"
             placeholder="看完想问点什么 —— 比如「#2 是怎么回事」「上周谁改得最多」">
      <button id="askBtn" class="yes">问</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   说明文案 —— 只写「会把人带偏」的那几处。
   ⚠️ 判断依据：读错它会做出错误动作才写；只是「知道了更好」的不写。
   页面上原来有 12 条、每条 200–400 字，那个密度本身就在收学习成本。
   ══════════════════════════════════════════════════════════════ */
const TIPS = {
  attention:
    '只放**命中了**和**判断没做成**的，而且都还没人表过态。⚠️ 未命中不进来 —— 它是「看过，没问题」，没有主张需要人确认；把它列进来会把这一屏变成数据总览，而总览打开两次就没人再打开了。' +
    '**「判断没做成」比「命中」更急**：它意味着这次根本没看，而它下一秒就会滑进「以为看过了」的那一类。',

  broken:
    '判断没做成：取不到数、模型调不通、模型返回的不是约定格式。**它不等于通过** —— 斜纹底是刻意的，它表示「这里缺了一块」，不是「这里有问题」。',

  verdict:
    '一次变更上可能有好几条判定（几条策略就几条）。整体定论**取最严的那一态**：判断没做成 > 命中 > 未命中。不取多数 —— 两条策略一条说没问题、一条说没看成，这次变更的答案就是「没看成」，多数票会把失败投掉。',

  strip:
    '一小块一次变更，颜色是它的定论。它不归一化 —— 你看到的是「一共这几件、各是什么」，不是一个百分比（5 件里的 3 件被画成 60%，读者记住的是 60%）。悬停看是哪一次。',

  projects:
    '空的项目方块不是「这个仓库没问题」—— 它是「这段时间没有变更进到平台眼里」。前者要放心，后者要去看事件源订阅得对不对。'
};

const tipLayer = document.getElementById('tipLayer');
document.addEventListener('click', (e) => {
  const t = e.target.closest('.help-tip');
  if (!t) { tipLayer.style.display = 'none'; return; }
  const key = t.dataset.tip;
  const text = TIPS[key] || '';
  tipLayer.innerHTML = mdLite(text);
  tipLayer.style.display = 'block';
  const r = t.getBoundingClientRect();
  const top = r.bottom + 8;
  tipLayer.style.top = (top + tipLayer.offsetHeight > innerHeight ? r.top - tipLayer.offsetHeight - 8 : top) + 'px';
  tipLayer.style.left = Math.min(r.left, innerWidth - tipLayer.offsetWidth - 16) + 'px';
  e.stopPropagation();
});

/** 只支持 **粗体** 与 `代码` —— 说明文案够用，不引一个 markdown 库 */
function mdLite(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ── 时间：说人话。「4 天前」比一个 ISO 串有用得多 */
function ago(iso) {
  if (!iso) return '';
  const ms = Date.now() - new Date(iso).getTime();
  if (!Number.isFinite(ms)) return '';
  const m = Math.floor(ms / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  const d = Math.floor(h / 24);
  if (d < 30) return d + ' 天前';
  return Math.floor(d / 30) + ' 个月前';
}

const OUTCOME_LABEL = { hit: '命中', miss: '未命中', error: '判断没做成' };
const OUTCOME_CLASS = { hit: 'h', miss: '', error: 'e' };
const KIND_LABEL = { mr: 'MR', push: '推送' };

/**
 * 一条判定的说明文本。
 *
 * ⚠️ 「未命中」与「没有写说明」是两件事：前者是结论（看过，没问题），
 * 后者是记录里缺了一块。混成同一句「没有结论说明」，读的人就没法区分
 * 「这条判定是干净的」与「这条判定没记全」—— 而这正是这个平台在防的形态。
 */
function whyText(j) {
  if (j.reason) return esc(j.reason);
  if (j.outcome === 'miss') {
    return '<span style="color:var(--ink-3)">未命中 —— 看过，没发现问题</span>';
  }
  return '<span style="color:var(--ink-3)">（这条记录没写结论说明）</span>';
}

/* ── 问她 ────────────────────────────────────────────────────
   这个请求会真的调模型，几秒到几十秒。所以三件事必须做：
   ① 按钮当场换成「在想…」并禁用 —— 一个没反应的按钮，与一个坏了的功能
      在用户那边长得一模一样；
   ② 已有的回答**不清空**，只在上方显示「在想…」，否则每次提问都像把上一条弄丢了；
   ③ 失败时把错误显示出来，并且**不把原始材料伪装成回答** —— 它是材料，不是结论。
*/
const askInput = document.getElementById('askInput');
const askBtn = document.getElementById('askBtn');
const askOut = document.getElementById('askOut');

async function doAsk() {
  const question = askInput.value.trim();
  if (!question) return;

  askBtn.disabled = true;
  askBtn.textContent = '在想…';

  const pending = document.createElement('div');
  pending.className = 'ans';
  pending.style.color = 'var(--ink-3)';
  pending.textContent = '在想…（这一步会真的问模型，可能要十几秒）';
  askOut.hidden = false;
  askOut.classList.remove('bad');
  askOut.prepend(pending);

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const d = await res.json();

    pending.remove();

    if (!res.ok || !d.ok) {
      askOut.classList.add('bad');
      askOut.insertAdjacentHTML('afterbegin', `
        <div class="err">${esc(d.error || '这次没有回答')}</div>
        ${d.facts ? `<details><summary>我手里的原始材料（它不是回答）</summary><pre>${esc(d.facts)}</pre></details>` : ''}
      `);
    } else {
      askOut.insertAdjacentHTML('afterbegin', `
        <div class="ans">${esc(d.answer)}</div>
        ${d.facts ? `<details><summary>她读的材料</summary><pre>${esc(d.facts)}</pre></details>` : ''}
      `);
    }
  } catch (e) {
    pending.remove();
    askOut.classList.add('bad');
    askOut.insertAdjacentHTML('afterbegin', `<div class="err">没连上：${esc(e.message)}</div>`);
  } finally {
    askBtn.disabled = false;
    askBtn.textContent = '问';
  }
}

askBtn.onclick = doAsk;
askInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing) doAsk();
});

/* ── 导览与她的解说 ──────────────────────────────────────────
   ⚠️ 她的话**挂在卡片里**，不是另开一个聊天区。这是「导游」与「历史老师」
   的分界：一段话如果只在聊天框里，读者得自己把它和左边那件东西对上；
   挂在卡片里，它就在讲这一件。

   ⚠️ 解说挂不上就不显示 —— 不显示比显示一段张冠李戴的话好得多。 */
let CURRENT_VIEW = null;
let CURRENT_TOUR = null;

function stopFor(eventId) {
  return (CURRENT_TOUR && CURRENT_TOUR.stops ? CURRENT_TOUR.stops : []).find(
    (s) => s.eventId === eventId,
  );
}

function herBox(eventId) {
  const s = stopFor(eventId);
  if (!s) return '';
  return `<div class="her">
    <div class="why"><b>${s.order}.</b>${esc(s.why)}</div>
    <div class="say">${esc(s.say)}</div>
  </div>`;
}

/** 把人送到那件展品面前：滚动 + 闪一下。如果要找的在折叠区里，先把它展开。 */
function jumpTo(eventId) {
  const sel = `[data-ev="${CSS.escape(eventId)}"]`;
  let target = document.querySelector(sel);

  if (!target) {
    const list = document.getElementById('restList');
    if (list && list.hidden) {
      document.getElementById('restToggle').click();
      target = document.querySelector(sel);
    }
  }
  if (!target) return;

  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.classList.add('flash');
  setTimeout(() => target.classList.remove('flash'), 1400);
}

function renderTour(d) {
  const bar = document.getElementById('tourBar');
  const t = d.tour || {};

  const stops = (t.stops || [])
    .map((s) => {
      const c = (CURRENT_VIEW && CURRENT_VIEW.changes ? CURRENT_VIEW.changes : []).find(
        (x) => x.eventId === s.eventId,
      );
      return `<li data-jump="${esc(s.eventId)}">
        <span class="no">${s.order}</span>
        <span class="tt">${esc(c ? c.title || c.eventId : s.eventId)}</span>
        <span class="tw">${esc(s.why)}</span>
      </li>`;
    })
    .join('');

  bar.innerHTML = `
    <div class="tintro">${esc(t.intro || '')}</div>
    ${stops ? `<ul class="tstops">${stops}</ul>` : ''}
    ${t.closing ? `<div class="tclosing">${esc(t.closing)}</div>` : ''}
    ${
      d.droppedStops
        ? `<div class="tclosing" style="color:var(--ink-3)">（另有 ${d.droppedStops} 段解说挂不到任何一条变更上，已经丢弃）</div>`
        : ''
    }`;

  bar.querySelectorAll('[data-jump]').forEach((li) => {
    li.onclick = () => jumpTo(li.dataset.jump);
  });
}

async function loadTour() {
  const sec = document.getElementById('tourSec');
  sec.hidden = false;
  document.getElementById('tourBar').innerHTML =
    '<div class="tintro" style="color:var(--ink-3)">她在先看一遍…（这一步会真的问模型）</div>';

  try {
    const res = await fetch('/api/tour', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: '{}',
    });
    const d = await res.json();

    if (!res.ok || !d.ok) {
      // 没有导览就不显示这块。**不留一句「她没来得及看」**：
      // 那会让人以为她看过了但没话说 —— 与「根本没看」是两件事。
      sec.hidden = true;
      return;
    }

    CURRENT_TOUR = d.tour;
    renderTour(d);
    if (CURRENT_VIEW) renderAttention(CURRENT_VIEW);
  } catch {
    sec.hidden = true;
  }
}

/* ── 渲染：项目 ───────────────────────────────────────────────
   一块一个项目。三样东西按重要性排：名字、要你管几件、变更条。
   其余（命中/没做成/未命中的明细）缩到脚注 —— 需要时才看。 */
function renderProjects(view) {
  const box = document.getElementById('projects');
  const changes = view.changes || [];

  if (!view.projects || view.projects.length === 0) {
    box.innerHTML = `<div class="proj alive" style="flex-basis:100%;border-top-color:var(--void)">
      <div class="pname">还没有任何项目</div>
      <div class="pstat" style="color:var(--ink-3);font-size:15px">平台还没判过任何变更</div>
      <div class="pmeta">这不表示「没有项目」—— 它表示还没有变更进到平台眼里</div>
    </div>`;
    return;
  }

  box.innerHTML = view.projects.map((p) => {
    const name = p.project || '未记录的项目';
    // 变更条按**时间**排（左旧右新），不按列表的顺序 —— 列表是按紧急度排的。
    // 一条横排的方块，读者会默认它是一根时间轴；混着紧急度排，它就成了一张
    // 没有轴的图，而「没有轴的图」正是这个项目一直在避免的东西。
    const mine = changes
      .filter((c) => (c.project || '') === (p.project || ''))
      .slice()
      .sort((a, b) => a.lastSeenAt.localeCompare(b.lastSeenAt));
    const strip = mine.slice(0, 14).map((c) =>
      `<i class="${OUTCOME_CLASS[c.verdict]}${c.project ? '' : ' u'}" title="${esc(c.title || c.eventId)} · ${OUTCOME_LABEL[c.verdict]}"></i>`
    ).join('');
    const more = mine.length > 14 ? `<i class="u" title="还有更早的 ${mine.length - 14} 次没画出来"></i>` : '';

    const cls = p.needAttention > 0
      ? (p.error > 0 ? 'broken' : 'attn')
      : 'alive';

    const stat = p.needAttention > 0
      ? `要你管 ${p.needAttention} 件`
      : '暂时没有要你管的';

    const meta = [
      `累计 ${p.changes} 次变更`,
      p.error > 0 ? `<span style="color:var(--err)">${p.error} 次没做成</span>` : '',
      p.lastActivityAt ? ago(p.lastActivityAt) : '',
      // 老记录没存项目名 —— 这是一个「当时没记」的缺口，不是「没有项目」。
      // 不写出来，这一桶就会被读成真的有一个叫「未记录」的仓库。
      p.project ? '' : '这批记录没存项目名'
    ].filter(Boolean).join(' · ');

    return `<div class="proj ${cls}">
      <div class="pname" title="${esc(name)}">${esc(name)}</div>
      <div class="pstat">${stat}${p.needAttention > 0 ? '' : '<small>最近的事都看过了</small>'}</div>
      ${strip || more ? `<div class="strip">${strip}${more}</div>` : ''}
      <div class="pmeta">${meta}</div>
    </div>`;
  }).join('');
}

/* ── 渲染：要你管的 ───────────────────────────────────────────
   一张卡 = 一次变更。**分两组，不混着排**：
   「判断没做成」与「命中」要人做的是两件不同的事（一个去查平台怎么坏了，
   一个去拿主意），而混在一张列表里按紧急度排，会让一个昨天超时的旧记录
   压住一件刚刚发生的事 —— 那个顺序没有人在读得懂的地方。 */
function renderAttention(view) {
  const list = document.getElementById('attnList');
  const need = (view.changes || []).filter((c) => c.pending > 0);

  document.getElementById('attnN').textContent = need.length ? `${need.length} 件` : '';

  if (need.length === 0) {
    list.innerHTML = `<div class="banner quiet" style="margin:0">
      <b>没有要你拿主意的。</b>${
        view.judgedChanges > 0
          ? `最近 ${view.judgedChanges} 次变更里，策略没报出问题、也没有判断没做成。` +
            `<br>⚠️ 这不等于项目干净 —— 它只等于<b>这两条策略</b>在这几次变更上没看出问题。`
          : `还没有变更被判定过。`
      }
    </div>`;
    return;
  }

  const broken = need.filter((c) => c.verdict === 'error');
  const hits = need.filter((c) => c.verdict !== 'error');

  const card = (c) => {
    const isBroken = c.verdict === 'error';
    // ⚠️ 标签说的是**人的话**，不是判定的结局名：
    // 「命中」要读成「看着可疑」，「判断没做成」要读成「这次没看成」。
    // 结局三态是给观察期统计用的，不是给读这一屏的人用的。
    const tag = isBroken
      ? `<span class="ntag e">这次没看成 <i class="help-tip" data-tip="broken" tabindex="0">?</i></span>`
      : `<span class="ntag h">看着可疑</span>`;

    // ⚠️ 不在这里再写一遍「它说了什么」—— 下面每条判定已经把话说全了。
    // 汇总行 + 逐条行重复同一句话，卡的密度翻倍而信息量为零，
    // 而长文案正是让人不再读这一屏的东西。
    const rows = c.judgments.map((j) => `
      <div class="jrow">
        <span class="dot ${OUTCOME_CLASS[j.outcome]}"></span>
        <span class="pol">${esc(j.policyId)} @ ${esc(j.policyVersion)}</span>
        <span class="why">${whyText(j)}</span>
        ${j.precondition ? `<span class="pre">前提：${esc(j.precondition)}</span>` : ''}
      </div>`).join('');

    // 表态是按**每条判定**落的（观察期的分母是「这条策略被核对过几次」），
    // 所以当这次变更上还有多条待表态时，得说清这一下会记到几条上 ——
    // 一次点掉三条判定，等于用一次「看过了」冒充三次。
    const ids = c.judgments
      .filter((j) => (j.outcome === 'hit' || j.outcome === 'error') && !j.reaction)
      .map((j) => j.id);
    const actIds = ids.length ? ids.join(',') : '';
    const hint = ids.length > 1
      ? `回写会同时记到 ${ids.length} 条判定上（这次变更上每条未表态的策略各一条）`
      : `回写会记进这条策略的观察期 —— 「判错了」是升级唯一的触发条件`;

    return `<div class="need ${isBroken ? 'broken' : ''}" data-ev="${esc(c.eventId)}">
      <div class="nhead">
        <span class="nwho">${esc(c.author || '未知作者')}</span>
        <span class="nwhen">${ago(c.lastSeenAt)}</span>
        <span class="ntitle">「${esc(c.title || c.eventId)}」</span>
        ${tag}
        <span class="nmeta">${c.project ? esc(c.project) : '项目未记录'}</span>
      </div>
      ${herBox(c.eventId)}
      ${rows}
      <div class="acts" data-ids="${actIds}">
        <button class="yes" data-r="adopted">判对了</button>
        <button class="no" data-r="rejected">判错了</button>
        <button class="ghost" data-r="ignored">先不管</button>
        <span class="hint">${hint}</span>
      </div>
    </div>`;
  };

  const group = (title, cls, note, items) => {
    if (items.length === 0) return '';
    return `<div class="grouphead ${cls}"><b>${title}</b>
        <span class="n">${items.length} 件</span>
        <span class="gh-note">${note}</span></div>
      ${items.map(card).join('')}`;
  };

  list.innerHTML =
    group('判断没做成', 'e', '它不是「有问题」，是「这次没看」', broken) +
    group('命中', 'h', '策略报了问题，等你拿主意', hits);
}

/* ── 渲染：其余的变更 ─────────────────────────────────────────
   它们也要在。未命中是「看过没问题」—— 藏起来，它与「没看过」
   就又分不开了；但它不该排在需要动手的前面。 */
function renderRest(view) {
  const list = document.getElementById('restList');
  // 这里的轴是**时间**，不是紧急度 —— 与「要你管的」正好相反，而这是刻意的：
  // 「要你管的」回答「先处理哪件」，其余回答「最近发生过什么」。
  // 一根时间轴被压成紧急度顺序，读者就再也读不出「这几天它都在动」这件事。
  const rest = (view.changes || [])
    .filter((c) => c.pending === 0)
    .slice()
    .sort((a, b) => b.lastSeenAt.localeCompare(a.lastSeenAt));
  const btn = document.getElementById('restToggle');

  document.getElementById('restSec').hidden = rest.length === 0;
  if (rest.length === 0) return;

  btn.textContent = `其余 ${rest.length} 次变更（已看过，没有待你表态的）—— 展开`;
  if (!rest._open) btn.dataset.closed = '1';

  list.innerHTML = rest.map((c) => {
    const rows = c.judgments.map((j) => `
      <div class="jrow">
        <span class="dot ${OUTCOME_CLASS[j.outcome]}"></span>
        <span class="pol">${esc(j.policyId)}</span>
        <span class="why">${j.reason ? esc(j.reason) : '<span style="color:var(--ink-3)">（未命中：看过，没发现问题）</span>'}</span>
        ${j.reaction ? `<span class="rtime">已表态：${esc(j.reaction)}</span>` : ''}
      </div>`).join('');
    return `<div class="row" data-ev="${esc(c.eventId)}" onclick="this.querySelector('.det').hidden=!this.querySelector('.det').hidden">
      <span class="dot ${OUTCOME_CLASS[c.verdict]}${c.verdict === 'miss' ? '' : ' r'}" style="flex:none"></span>
      <span class="rname">${esc(c.title || c.eventId)}</span>
      <span class="rproj">${esc(c.project || '未记录')}</span>
      <span class="rtime">${ago(c.lastSeenAt)}</span>
      <div class="det" hidden style="flex-basis:100%">${rows}</div>
    </div>`;
  }).join('');

  btn.onclick = () => {
    const isHidden = list.hidden;
    list.hidden = !isHidden;
    btn.textContent = isHidden
      ? `收起`
      : `其余 ${rest.length} 次变更（已看过，没有待你表态的）—— 展开`;
  };
}

/* ── 渲染：横幅 ───────────────────────────────────────────────
   ⚠️ 四种状态是四件不同的事。这是这个平台的全篇靶子，落到它自己的第一屏：
   一个列表可以意味着「最近真的没事」，也可以意味着「根本没人在看」。
   让它们长得一样，管理员就会把「没人盯着」读成「没事发生」。 */
function renderBanner(view) {
  const el = document.getElementById('banner');
  const s = view.viewState;

  if (s === 'live') { el.innerHTML = ''; return; }

  const map = {
    stale: {
      cls: 'stop',
      html: `<b>底下这些是旧数据，平台现在没在看。</b>
        常驻没有在跑（或已经迟了），所以「没有新变更」<b>不等于</b>「你的仓库最近没有变更」——
        这两件事在这一屏上长得一模一样，而这正是这个平台存在的理由。
        <br>下一步：<code>npm run watch</code>，或用看门狗把它拉起来。`
    },
    'never-judged': {
      cls: 'info',
      html: `<b>平台还没有判过任何变更。</b>库里一条判断记录都没有 ——
        这不是「项目很干净」，是<b>还没有东西进来过</b>。
        <br>下一步：确认事件源连的哪个仓库、订阅哪个分支（常驻默认订阅 <code>push</code>，不是 MR）。`
    },
    idle: {
      cls: 'quiet',
      html: `<b>在看，但还没有变更进来。</b>常驻在跑、心跳是通的，只是它订阅的分支上还没有新提交 ——
        或者它盯的仓库不是你以为的那个。`
    }
  };

  const m = map[s];
  if (!m) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="banner ${m.cls}">${m.html}</div>`;
}

/* ── 渲染：顶栏状态徽标 ───────────────────────────────────────
   它回答「平台还在不在」。⚠️ 「从没跑过」与「跑过但停了」是两种状态：
   前者是还没部署，后者是挂了 —— 要做的事完全不同。 */
function renderLive(view) {
  const d = view.daemon || {};
  const el = document.getElementById('live');
  const label = document.getElementById('liveText');
  const map = {
    alive: ['alive', '在看着'],
    late: ['late', '迟了'],
    stopped: ['stopped', '已经停了'],
    never: ['', '从没跑过']
  };
  const [cls, text] = map[d.status] || ['', '状态不明'];
  el.className = 'live ' + cls;
  label.textContent = text;
  if (d.note) el.title = d.note;
}

/* ── 渲染：策略观察 ───────────────────────────────────────────
   原来是一张 8 列的表。表的问题不是不好看，是它要求读者**先知道列的含义**
   才能读出第一句话。换成一行一条策略，每行自己把话说完整。 */
function renderStats(stats) {
  const box = document.getElementById('statsList');
  document.getElementById('tabWatchN').textContent = stats.length ? `(${stats.length})` : '';

  if (!stats.length) {
    box.innerHTML = `<div class="empty">还没有策略跑过</div>`;
    return;
  }

  box.innerHTML = stats.map((s) => {
    const dots = (s.sequence || []).slice(-30).map((x) =>
      `<i class="${x.outcome === 'hit' ? 'h' : x.outcome === 'error' ? 'e' : ''}${x.reviewed ? ' r' : ''}"></i>`
    ).join('');

    return `<div class="stat-row">
      <span class="sp">${esc(s.policyId)} @ ${esc(s.policyVersion)}</span>
      <span class="sv">评估 <b>${s.total}</b></span>
      <span class="sv">看过 <b>${s.reviewed}</b></span>
      <span class="sv">命中 <b>${s.hit}</b></span>
      <span class="sv">没做成 <b class="${s.error > 0 ? 'bad' : ''}">${s.error}</b></span>
      <span class="sv">否定 <b>${s.rejected}</b></span>
      <span class="dots" title="逐条结局，左旧右新；有描边的表示被人表过态">${dots}</span>
      <span class="health">${esc((s.health && s.health.note) || '')}</span>
    </div>`;
  }).join('');
}

/* ── 渲染：判断记录 ───────────────────────────────────────────
   这是「追究用的」那一层，默认折叠在第二个 tab 里。 */
function renderLog(rows) {
  const box = document.getElementById('logList');
  document.getElementById('tabLogN').textContent = rows.length ? `(${rows.length})` : '';

  if (!rows.length) {
    box.innerHTML = `<div class="empty">还没有判断记录</div>`;
    return;
  }

  box.innerHTML = rows.map((r) => `
    <div class="row" onclick="this.querySelector('.det').hidden=!this.querySelector('.det').hidden">
      <span class="dot ${OUTCOME_CLASS[r.outcome]}" style="width:7px;height:7px;border-radius:2px;flex:none"></span>
      <span class="rname">${esc(r.title || r.eventId)}</span>
      <span class="rproj">${esc(r.policyId)}</span>
      <span class="rtime">${ago(r.createdAt)}</span>
      <div class="det" hidden style="flex-basis:100%">
        <div class="jrow">
          <span class="dot ${OUTCOME_CLASS[r.outcome]}"></span>
          <span class="pol">${OUTCOME_LABEL[r.outcome]}</span>
          <span class="why">${esc(r.reason || '（没有结论说明）')}</span>
        </div>
        ${(r.evidence || []).map((e) => `<div class="jrow" style="border:none;padding:2px 0 2px 15px">
          <span class="pol" style="min-width:88px">${esc(e.kind)}</span>
          <span class="why">${esc(e.detail)}</span>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

/* ── 表态 ─────────────────────────────────────────────────────
   只写一条记录一次 —— 观察期的分母是「这条判定被核对过几次」。 */
async function react(btn, ids, reaction) {
  const bar = btn.closest('.acts');
  const buttons = bar.querySelectorAll('button');
  buttons.forEach((b) => (b.disabled = true));
  try {
    const res = await fetch('/api/reaction', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ judgmentIds: ids, reaction })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '表态失败');
    await load();
  } catch (e) {
    alert('表态没成功：' + e.message + '\n\n记录没有变化 —— 别以为它记下了。');
    buttons.forEach((b) => (b.disabled = false));
  }
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.acts button');
  if (!btn) return;
  const ids = (btn.closest('.acts').dataset.ids || '').split(',').filter(Boolean).map(Number);
  if (!ids.length) return;
  react(btn, ids, btn.dataset.r);
});

/* ── tab 切换 ─────────────────────────────────────────────── */
document.querySelectorAll('.tabs button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('.pane').forEach((p) =>
      p.classList.toggle('on', p.id === 'pane-' + b.dataset.pane));
  };
});

/* ── 装配 ─────────────────────────────────────────────────── */
let TOUR_STARTED = false;

async function load() {
  const [pv, st, lg] = await Promise.all([
    fetch('/api/project-view').then((r) => r.json()),
    fetch('/api/stats').then((r) => r.json()),
    fetch('/api/judgments?limit=100').then((r) => r.json())
  ]);

  CURRENT_VIEW = pv;

  renderLive(pv);
  renderBanner(pv);
  renderProjects(pv);
  renderAttention(pv);
  renderRest(pv);
  renderStats(st.stats || []);
  renderLog(lg.rows || []);

  // 导览**只在她第一次打开时生成一次**：表态之后 load() 会重跑，
  // 每次重跑都问一遍模型，等于为同一个问题反复付钱，而且答案还会飘。
  if (!TOUR_STARTED) {
    TOUR_STARTED = true;
    loadTour();
  }
}

load().catch((e) => {
  document.getElementById('banner').innerHTML =
    `<div class="banner stop"><b>读不到数据。</b>控制台进程或库出了问题：${esc(e.message)}
     <br>⚠️ 这一屏空着<b>不等于</b>没什么事 —— 它只是没读出来。</div>`;
});
</script>
